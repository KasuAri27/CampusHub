server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campushub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: root
    password: ${CAMPUSHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    time-zone: Asia/Shanghai

  # ========== 新增邮件配置 ==========
  mail:
    host: smtp.exmail.qq.com         # 南大 smail SMTP 服务器
    port: 465                           
    username: ${CAMPUSHUB_SMTP_USERNAME:}
    password: ${CAMPUSHUB_SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          trust: smtp.exmail.qq.com
          ssl:
            enable: true
          socketFactory:
            port:465
            class:javax.net.ssl.SSLSocketFactory
          from: ${CAMPUSHUB_SMTP_USERNAME:}

# JWT 身份验证安全配置
jwt:
  secret: ${CAMPUSHUB_JWT_SECRET}
  expiration: 86400000

# AES 加解密配置
aes:
  secret-key: ${CAMPUSHUB_AES_KEY}

# 日志级别控制
logging:
  level:
    com.campushub: DEBUG