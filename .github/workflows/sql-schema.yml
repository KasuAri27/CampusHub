# 数据库结构校验：独立于业务测试，仅在 SQL 相关文件变动时触发，
# 避免业务分支重构或升级时被结构断言连带失败。断言期望值见 backend/SQL/ci-assertions.env，随 SQL 同批维护。
name: SQL 结构校验
on:
  push:
    branches: [main, user, admin, task, chat, redis]
    paths:
      - 'backend/SQL/**'
      - 'backend/src/test/resources/legacy-schema.sql'
      - 'backend/src/test/resources/legacy-migration-fixture.sql'
      - 'backend/src/test/resources/schema-fingerprint.sql'
      - '.github/workflows/sql-schema.yml'
  pull_request:
    paths:
      - 'backend/SQL/**'
      - 'backend/src/test/resources/legacy-schema.sql'
      - 'backend/src/test/resources/legacy-migration-fixture.sql'
      - 'backend/src/test/resources/schema-fingerprint.sql'
      - '.github/workflows/sql-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-schema-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schema:
    name: 全新建库与旧库升级结构一致
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 仅用于结构校验的一次性测试库，绝不使用生产连接与密钥。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: campushub_schema_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 校验全新建库、旧库升级及两者结构一致
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          # 容器内客户端默认按 latin1 发送脚本；必须显式 utf8mb4，否则中文被误读、按显示宽度限长的约束会误判。
          db() { docker exec -i "$MYSQL_CONTAINER_ID" mysql --default-character-set=utf8mb4 -uroot -pci-only-password "$@"; }
          strip_use() { sed '/^USE campushub;/d' "$1"; }
          # shellcheck disable=SC1091
          source backend/SQL/ci-assertions.env
          db -e 'CREATE DATABASE campushub_migration_ci CHARACTER SET utf8mb4; CREATE DATABASE campushub_schema_ci CHARACTER SET utf8mb4;'
          # 旧库：旧结构 + 旧数据，迁移脚本按编号各执行两次以验证可重复运行。
          strip_use backend/src/test/resources/legacy-schema.sql | db campushub_migration_ci
          db campushub_migration_ci < backend/src/test/resources/legacy-migration-fixture.sql
          for migration in $(ls backend/SQL/migrations/*.sql | sort); do
            db campushub_migration_ci < "$migration"
            db campushub_migration_ci < "$migration"
          done
          actual=$(db -N -B campushub_migration_ci -e "SELECT CONCAT(status,':',IF(amount_due IS NULL,'legacy','charged'),':',payment_code) FROM orders WHERE id=1")
          test "$actual" = "$LEGACY_ORDER_1"
          copied=$(db -N -B campushub_migration_ci -e 'SELECT COUNT(*) FROM t_task_flea WHERE task_id=2 AND item_price=12.34')
          test "$copied" = "$LEGACY_FLEA_COPIED"
          # 新库：按编号执行全部建表脚本与测试数据（01 建库脚本除外）。
          for script in $(ls backend/SQL/0[2-9]-*.sql | sort); do
            strip_use "$script" | db campushub_schema_ci
          done
          seeded=$(db -N -B campushub_schema_ci -e "SELECT CONCAT((SELECT COUNT(*) FROM users),':',(SELECT COUNT(*) FROM tasks),':',(SELECT COUNT(*) FROM orders),':',(SELECT credit_score FROM users WHERE student_id='241880903'))")
          test "$seeded" = "$FRESH_SEED"
          # 结构比对：升级后的旧库必须与全新建库一致（历史保留列除外）。
          db -N -B campushub_schema_ci < backend/src/test/resources/schema-fingerprint.sql > fresh-schema.txt
          db -N -B campushub_migration_ci < backend/src/test/resources/schema-fingerprint.sql > migrated-schema.txt
          diff -u fresh-schema.txt migrated-schema.txt